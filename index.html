<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketchtune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#f3f5f7; --paper-2:#ffffff; --grid:#d7dee6; --grid-strong:#b9c4cf;
  --ink:#141a21; --ink-2:#5b6672; --chip:#ffffff; --chip-border:#d2d9e1; --chip-on:#141a21; --chip-on-ink:#ffffff;
  --head:#141a21; --shadow:0 1px 0 rgba(20,26,33,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --paper:#15191e; --paper-2:#1c2127; --grid:#2a323b; --grid-strong:#3a4550;
  --ink:#eef2f6; --ink-2:#9aa6b2; --chip:#1c2127; --chip-border:#303941; --chip-on:#eef2f6; --chip-on-ink:#15191e;
  --head:#eef2f6; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#15191e; --paper-2:#1c2127; --grid:#2a323b; --grid-strong:#3a4550;
  --ink:#eef2f6; --ink-2:#9aa6b2; --chip:#1c2127; --chip-border:#303941; --chip-on:#eef2f6; --chip-on-ink:#15191e;
  --head:#eef2f6; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--paper);color:var(--ink);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;padding:8px 12px 6px;gap:8px}
@media (min-width:900px){
  .app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"header header" "stage side";column-gap:18px;row-gap:10px;padding:14px 20px 10px}
  header{grid-area:header}
  .stage{grid-area:stage}
  .panel{grid-area:side;overflow:hidden}
  footer{grid-area:footer}
  .panel{gap:12px}
  .page{gap:12px}
}
@media (min-width:1300px){ .app{grid-template-columns:minmax(0,1fr) 420px;padding:18px 28px 12px} }
header{display:flex;align-items:center;justify-content:space-between;font-size:15px}
header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
header .meta{color:var(--ink-2);font-size:13px}
.stage{position:relative;flex:1;min-height:0;border:1.5px solid var(--grid-strong);border-radius:8px;background:var(--paper-2);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#draw{touch-action:none;cursor:crosshair}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:var(--ink-2);font-size:13px;pointer-events:none;transition:opacity .3s}
.hint.off{opacity:0}
.panel{display:flex;flex-direction:column;gap:8px;min-height:0}
.transport{display:flex;align-items:center;gap:8px}
.tabs{display:flex;background:var(--chip);border:1.5px solid var(--chip-border);border-radius:14px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.tabs button{flex:1;height:38px;min-width:0;padding:0 4px;border:0;border-radius:11px;box-shadow:none;background:transparent;gap:5px;font-size:12px;font-weight:500;color:var(--ink-2)}
.tabs button.on{background:var(--chip-on);color:var(--chip-on-ink)}
.tabs button svg{width:16px;height:16px}
.pages{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page{display:none;flex-direction:column;gap:10px;padding:2px 2px 6px}
.page.on{display:flex}
.row.wrap{flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid button{width:100%;min-width:0;height:36px;padding:0}
.genres{display:flex;flex-wrap:wrap;gap:6px}
.genres button{height:30px;min-width:0;padding:0 11px;font-size:13px}
.form{display:flex;flex-direction:column;gap:8px}
.form .f{display:flex;flex-direction:column;gap:3px;font-size:13px}
.form .f span{color:var(--ink-2);font-size:12px}
.form input,.form select{font:inherit;font-size:14px;color:var(--ink);background:var(--chip);border:1.5px solid var(--chip-border);border-radius:10px;padding:8px 10px;outline:none;width:100%;box-sizing:border-box}
.form input:focus-visible,.form select:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.status{font-size:12px;color:var(--ink-2)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.row.between{justify-content:space-between}
.grp{display:flex;gap:6px;align-items:center}
button{font:inherit;color:var(--ink);background:var(--chip);border:1.5px solid var(--chip-border);border-radius:999px;
  height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:var(--shadow);touch-action:manipulation;transition:transform .08s,background .15s,color .15s}
button:active{transform:scale(.94)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tempo{display:inline-flex;align-items:center;border:1.5px solid var(--chip-border);border-radius:999px;background:var(--chip);height:38px;box-shadow:var(--shadow)}
.tempo button{border:0;box-shadow:none;height:36px;min-width:34px;background:transparent}
.tempo output{min-width:36px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;justify-items:center;padding:4px 2px}
[hidden]{display:none!important}
.sw,.sw.on{width:32px;height:32px;min-width:32px;padding:0;border:0;border-radius:50%;background:var(--c);position:relative;box-shadow:none}
.sw.on::after{content:"";position:absolute;inset:-4px;border:2px solid var(--c);border-radius:50%}
.keys{display:flex;height:36px;border:1.5px solid var(--chip-border);border-radius:8px;overflow:hidden;background:#fff;position:relative;width:148px;min-width:148px;box-shadow:var(--shadow)}
.keys button{border:0;border-radius:0;box-shadow:none;position:absolute;top:0;padding:0;min-width:0}
.keys .w{height:100%;background:#fff;border-right:1px solid #cfd6dd;color:#141a21}
.keys .b{height:58%;background:#141a21;color:#fff;z-index:2;width:10px;margin-left:-5px;border-radius:0 0 3px 3px}
.keys .w.on{background:#6f7bff}
.keys .b.on{background:#6f7bff}
.dot{display:inline-block;border-radius:50%;background:currentColor}
.sec{display:flex;flex-direction:column;gap:6px}
.sec.transport{flex-direction:row;align-items:center;gap:8px}
.spacer{flex:1}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.lblrow{display:flex;align-items:center;justify-content:space-between}
button.big{width:48px;height:48px;min-width:48px}
button.text{padding:0 12px;font-size:13px;font-weight:500;gap:6px;white-space:nowrap}
button.static{pointer-events:none;font-variant-numeric:tabular-nums;font-size:13px}
.seg{display:inline-flex;border:1.5px solid var(--chip-border);border-radius:999px;background:var(--chip);box-shadow:var(--shadow);overflow:hidden}
.seg button{border:0;border-radius:0;box-shadow:none;height:36px}
.seg button+button{border-left:1.5px solid var(--chip-border)}
.seg.small button{height:32px;min-width:34px;font-size:13px;font-weight:600;padding:0 9px}
.seg button.on{border-color:var(--chip-on)}
.slot{font-weight:600;font-size:14px}
footer{text-align:center;color:var(--ink-2);font-size:12px;padding-top:2px}
.vol{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.vol svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input[type=range]{-webkit-appearance:none;appearance:none;width:84px;height:4px;border-radius:2px;background:var(--grid-strong);outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:0;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:0;cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.sliders{display:flex;flex-direction:column;gap:8px}
.sliders label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.sliders label span{width:52px}
.sliders input{width:auto}
.sliders input{flex:1;width:auto}
.mini{font-size:13px;color:var(--ink-2);margin-right:4px}
.ai{display:flex;gap:6px;align-items:stretch}
.ai textarea{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1.5px solid var(--chip-border);border-radius:14px;padding:8px 12px;resize:none;height:38px;line-height:20px;outline:none}
.ai textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ai textarea::placeholder{color:var(--ink-2)}
.ai button.go{min-width:70px}
.ai .busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--ink-2);line-height:1.4}

.genres{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch}
.genres::-webkit-scrollbar{display:none}
.genres button{height:30px;min-width:0;padding:0 11px;font-size:13px;flex:0 0 auto}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--chip-on);color:var(--chip-on-ink);padding:6px 12px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:380px){ button{height:34px;min-width:34px} .sw,.sw.on{width:26px;height:26px;min-width:26px} .keys{width:126px;min-width:126px} .tabs button span{display:none} }
@media (max-width:899px){
  .app{padding:6px 10px 6px;gap:6px}
  .stage{flex:1 1 auto;min-height:38vh}
  .panel{flex:0 0 auto}
  .pages{max-height:32vh}
  header .meta{display:none}
  .tabs button span{font-size:11px}
  .swatches{gap:5px}
  .ai textarea{font-size:16px}
  .form input,.form select{font-size:16px}
}
@media (max-width:899px) and (max-height:640px){ .pages{max-height:24vh} .stage{min-height:30vh} }
@media (prefers-reduced-motion:reduce){ button{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sketchtune</h1>
    <span class="meta" id="meta">C major · 16 steps</span>
    <div class="vol"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l4 4V6L7 10z M15 9a4 4 0 0 1 0 6"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="0.4" aria-label="Volume"></div>
    <button id="theme" title="Toggle dark mode" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  </header>

  <div class="stage" id="stage">
    <canvas id="grid"></canvas>
    <canvas id="draw"></canvas>
    <div class="hint" id="hint">Draw anything. Height is pitch, colour is the instrument.</div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="panel">
    <div class="transport">
      <button id="play" class="big" title="Play / pause" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 5l12 7-12 7z"/></svg></button>
      <div class="tempo"><button id="bpmDown" aria-label="Slower">−</button><output id="bpm">96</output><button id="bpmUp" aria-label="Faster">+</button></div>
      <span class="spacer"></span>
      <button id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="clear" title="Clear canvas" aria-label="Clear canvas"><svg viewBox="0 0 24 24"><path d="M5 7h14 M9 7V4h6v3 M7 7l1 13h8l1-13"/></svg></button>
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="draw" class="on"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg><span>Draw</span></button>
      <button role="tab" data-tab="sound"><svg viewBox="0 0 24 24"><path d="M3 12c3-6 6-6 9 0s6 6 9 0"/></svg><span>Sound</span></button>
      <button role="tab" data-tab="pattern"><svg viewBox="0 0 24 24"><path d="M4 6h16 M4 12h10 M4 18h13"/></svg><span>Pattern</span></button>
      <button role="tab" data-tab="ai"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.3L21 11l-6.8 1.7L12 21l-2.2-8.3L3 11l6.8-1.7z"/></svg><span>AI</span></button>
      <button role="tab" data-tab="export"><svg viewBox="0 0 24 24"><path d="M12 4v11 M7 10l5 5 5-5 M4 19h16"/></svg><span>Export</span></button>
    </nav>

    <div class="pages">
      <section class="page on" data-page="draw">
        <div class="row">
          <div class="seg">
            <button id="pen" class="on" title="Pencil" aria-label="Pencil"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></button>
            <button id="eraser" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="M16 4l5 5-9 9H8l-4-4z M9 18h11"/></svg></button>
          </div>
          <span class="spacer"></span>
          <button id="trace" title="Trace a photo" aria-label="Trace a photo"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z M12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg></button>
          <input type="file" id="traceFile" accept="image/*" capture="environment" hidden>
          <button id="shuffle" title="Shuffle colours" aria-label="Shuffle colours"><svg viewBox="0 0 24 24"><path d="M3 7h4l10 10h4 M17 4l4 3-4 3 M3 17h4l2-2 M14 9l3-3h4 M17 20l4-3-4-3"/></svg></button>
        </div>
        <div class="swatches" id="swatches"></div>
        <div class="lblrow"><div class="lbl">Shapes</div>
          <div class="seg small" id="sizes"><button data-size="0">S</button><button data-size="1" class="on">M</button><button data-size="2">L</button></div>
        </div>
        <div class="grid" id="shapes"></div>
        <div class="lbl">Genre</div>
        <div class="genres" id="genres"></div>
      </section>

      <section class="page" data-page="sound">
        <div class="lbl">Key</div>
        <div class="row">
          <div class="keys" id="keys"></div>
          <div class="seg small">
            <button id="octDown" title="Octave down" aria-label="Octave down">−</button>
            <button id="octLabel" class="static" aria-live="polite">Oct 4</button>
            <button id="octUp" title="Octave up" aria-label="Octave up">+</button>
          </div>
          <button id="scale" class="text" title="Scale" aria-label="Change scale">major</button>
        </div>
        <div class="lbl">Feel</div>
        <div class="sliders">
          <label><span>Swing</span><input type="range" id="swing" min="0" max="0.6" step="0.02" value="0" aria-label="Swing"></label>
          <label><span>Reverb</span><input type="range" id="reverb" min="0" max="1" step="0.02" value="0.25" aria-label="Reverb"></label>
          <label><span>Delay</span><input type="range" id="delay" min="0" max="0.8" step="0.02" value="0.15" aria-label="Delay"></label>
        </div>
        <div class="row">
          <span class="mini">Chord</span>
          <div class="seg small" id="chord">
            <button data-c="off" class="on">Off</button><button data-c="triad">Triad</button><button data-c="power">Power</button><button data-c="seventh">7th</button>
          </div>
        </div>
      </section>

      <section class="page" data-page="pattern">
        <div class="row between">
          <div class="seg" id="slots">
            <button class="slot on" data-slot="0">1</button>
            <button class="slot" data-slot="1">2</button>
            <button class="slot" data-slot="2">3</button>
          </div>
          <div class="seg small" id="density" title="Steps per bar">
            <button data-steps="8" aria-label="8 steps per bar">8</button>
            <button data-steps="16" class="on" aria-label="16 steps per bar">16</button>
            <button data-steps="32" aria-label="32 steps per bar">32</button>
          </div>
          <button id="loop" class="text" title="Loop length" aria-label="Loop length">2 bars</button>
        </div>
        <div class="row wrap">
          <button id="preset" class="text" title="Load a starter sketch" aria-label="Load a starter sketch"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.3L21 11l-6.8 1.7L12 21l-2.2-8.3L3 11l6.8-1.7z"/></svg>Starter sketch</button>
          <button id="save" class="text" title="Save to this browser" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 10 0 3.5 3.5 0 0 1 0 8z"/></svg>Save</button>
          <button id="share" class="text" title="Copy a link to this sketch" aria-label="Copy share link"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"/></svg>Share link</button>
        </div>
      </section>

      <section class="page" data-page="ai">
        <div class="ai">
          <textarea id="aiPrompt" rows="1" placeholder="e.g. add a gentle bassline"></textarea>
          <button id="aiGo" class="go text" aria-label="Compose with AI"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.3L21 11l-6.8 1.7L12 21l-2.2-8.3L3 11l6.8-1.7z"/></svg>Compose</button>
        </div>
        <div class="note" id="aiNote">Adds strokes in the selected colour using a model you connect below.</div>
        <div class="lblrow"><div class="lbl">Your model</div><span class="mini" id="aiLabel">Not connected</span></div>
        <div class="form">
          <label class="f"><span>Provider</span>
            <select id="llmProvider">
              <option value="anthropic">Anthropic (Claude)</option>
              <option value="openai">OpenAI</option>
              <option value="gemini">Google Gemini</option>
              <option value="compatible">OpenAI-compatible (Ollama, LM Studio, Groq, OpenRouter)</option>
            </select></label>
          <label class="f" id="fBase" hidden><span>Base URL</span><input id="llmBase" placeholder="http://localhost:11434/v1" autocomplete="off"></label>
          <label class="f"><span>Model</span><input id="llmModel" autocomplete="off"></label>
          <label class="f"><span>API key</span><input id="llmKey" type="password" placeholder="Stays in this browser only" autocomplete="off"></label>
          <div class="row">
            <button id="llmSave" class="text on">Save</button>
            <button id="llmTest" class="text">Test</button>
            <button id="llmClear" class="text">Remove</button>
            <span class="status" id="llmStatus"></span>
          </div>
        </div>
      </section>

      <section class="page" data-page="export">
        <div class="row wrap">
          <button id="expAudio" class="text" title="Render the loop to audio"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12 M9 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z M19 16a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/></svg>Audio</button>
          <button id="expVideo" class="text" title="Record a vertical video of the loop"><svg viewBox="0 0 24 24"><path d="M3 7h12v10H3z M15 10l6-3v10l-6-3"/></svg>Video</button>
          <div class="seg small" id="expLoops" title="Loops"><button data-l="1">1×</button><button data-l="2" class="on">2×</button><button data-l="4">4×</button></div>
        </div>
        <div class="note" id="expNote">Audio renders instantly. Video records while the loop plays, in portrait for sharing.</div>
      </section>
    </div>
  </div>


<script>
(() => {
'use strict';
// ---------- state ----------
const COLORS = ['#1fa66a','#e23d2e','#6f5cf1','#f0a21b','#1e58c9','#e2439b','#5db3f0','#141a21'];
const GENRES = {
  pop:     ['pluck','bell','pad','acoustic','bass','lead','chime','kick'],
  acoustic:['acoustic','acousticlo','piano','flute','upright','nylon','shaker','softkick'],
  punk:    ['powerchord','distgtr','cleangtr','acoustic','rockbass','shout','hat','kick'],
  techno:  ['stab','pluck','pad','acid','subbass','supersaw','hat','kick'],
  house:   ['organ','stab','pad','piano','subbass','chime','clap','kick'],
  dubstep: ['wobble','growl','pad','lead','subbass','laser','snare','kick'],
  hiphop:  ['piano','bell','pad','acoustic','eightoeight','lead','snare','kick'],
  lofi:    ['lofipiano','bell','tape','acoustic','subbass','flute','rim','softkick'],
  ambient: ['pad','bell','tape','chime','drone','flute','chime','softkick'],
  chiptune:['square','pulse','nes','arp','tribass','pulse','noise','kick'],
};
let INSTR = GENRES.pop;
const SCALES  = {major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], pentatonic:[0,2,4,7,9], dorian:[0,2,3,5,7,9,10]};
const KEYNAMES= ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ROWS = 14;
const state = {
  tool:'pen', color:0, bpm:96, genre:'pop', volume:.4, swing:0, reverb:.25, delay:.15, chord:'off', playing:false, key:0, octave:4, scale:'major',
  stepsPerBar:16, bars:2, slot:0, patterns:[[],[],[]], theme:null
};
const strokes = () => state.patterns[state.slot];

// ---------- dom ----------
const $ = id => document.getElementById(id);
const stage=$('stage'), gridC=$('grid'), drawC=$('draw'), gctx=gridC.getContext('2d'), dctx=drawC.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  const r=stage.getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2);
  const oldW=W, oldH=H;
  W=r.width;H=r.height;
  if(oldW&&oldH&&(oldW!==W||oldH!==H)){ const sx=W/oldW, sy=H/oldH; for(const pat of state.patterns) for(const s of pat) for(const p of s.pts){ p.x*=sx; p.y*=sy; } }
  for(const c of [gridC,drawC]){c.width=W*DPR;c.height=H*DPR;}
  gctx.setTransform(DPR,0,0,DPR,0,0); dctx.setTransform(DPR,0,0,DPR,0,0);
  drawGrid(); render();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(()=>{ const r=stage.getBoundingClientRect(); if(Math.abs(r.width-W)>1||Math.abs(r.height-H)>1) resize(); }).observe(stage);

const totalSteps = () => state.stepsPerBar*state.bars;
const colW = () => W/totalSteps();
const rowH = () => H/ROWS;

function drawGrid(){
  gctx.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);
  const g=cs.getPropertyValue('--grid').trim(), gs=cs.getPropertyValue('--grid-strong').trim();
  gctx.lineWidth=1;
  const n=totalSteps();
  for(let i=1;i<n;i++){ gctx.strokeStyle=(i%state.stepsPerBar===0)?gs:g; gctx.lineWidth=(i%state.stepsPerBar===0)?1.5:1;
    const x=Math.round(i*colW())+.5; gctx.beginPath();gctx.moveTo(x,0);gctx.lineTo(x,H);gctx.stroke(); }
  gctx.strokeStyle=g; gctx.lineWidth=1;
  for(let j=1;j<ROWS;j++){ const y=Math.round(j*rowH())+.5; gctx.beginPath();gctx.moveTo(0,y);gctx.lineTo(W,y);gctx.stroke(); }
}

// ---------- drawing ----------
let current=null, erasing=false, placing=null;
function pos(e){ const r=drawC.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
drawC.addEventListener('pointerdown',e=>{
  drawC.setPointerCapture(e.pointerId); $('hint').classList.add('off');
  const p=pos(e);
  if(state.tool==='eraser'){ erasing=true; eraseAt(p); return; }
  if(state.tool==='shape'){ placing={color:state.color,pts:shapePts(state.shape,state.size,p)}; strokes().push(placing); render(); return; }
  current={color:state.color,pts:[p]}; strokes().push(current); render();
});
drawC.addEventListener('pointermove',e=>{
  const p=pos(e);
  if(erasing){ eraseAt(p); return; }
  if(placing){ placing.pts=shapePts(state.shape,state.size,p); render(); return; }
  if(!current) return;
  const last=current.pts[current.pts.length-1];
  if(Math.hypot(p.x-last.x,p.y-last.y)>2){ current.pts.push(p); render(); }
});
const endStroke=()=>{ if(current&&current.pts.length<2){ current.pts.push({x:current.pts[0].x+1,y:current.pts[0].y}); } current=null; erasing=false; placing=null; render(); };
drawC.addEventListener('pointerup',endStroke); drawC.addEventListener('pointercancel',endStroke);

function eraseAt(p){
  const R=14; const arr=strokes(); let changed=false;
  for(let i=arr.length-1;i>=0;i--){
    const s=arr[i]; const parts=[]; let cur=[];
    for(const q of s.pts){ if(Math.hypot(q.x-p.x,q.y-p.y)<R){ changed=true; if(cur.length>1)parts.push(cur); cur=[]; } else cur.push(q); }
    if(cur.length>1)parts.push(cur);
    if(changed){ arr.splice(i,1,...parts.map(pts=>({color:s.color,pts}))); }
  }
  if(changed) render();
}

// ---------- shapes ----------
// each shape is a list of unit points (x 0..1, y 0..1, y down); sizes are in grid columns and rows so shapes land on the beat
const SIZES=[[4,2],[8,4],[16,8]];
const unitWave=(cycles,n)=>Array.from({length:n+1},(_,i)=>[i/n,.5-.5*Math.cos(i/n*Math.PI*2*cycles+Math.PI)]);
const SHAPES={
  line:    {d:'M3 12h18', pts:[[0,.5],[1,.5]]},
  rise:    {d:'M4 18L20 6', pts:[[0,1],[1,0]]},
  fall:    {d:'M4 6l16 12', pts:[[0,0],[1,1]]},
  wave:    {d:'M3 12c3-7 6-7 9 0s6 7 9 0', pts:unitWave(1,48)},
  ripple:  {d:'M3 12c1.5-5 3-5 4.5 0s3 5 4.5 0 3-5 4.5 0 3 5 4.5 0', pts:unitWave(2,64)},
  zigzag:  {d:'M3 17l4.5-10 4.5 10 4.5-10 4.5 10', pts:[[0,1],[.25,0],[.5,1],[.75,0],[1,1]]},
  mountain:{d:'M3 18l9-12 9 12', pts:[[0,1],[.5,0],[1,1]]},
  valley:  {d:'M3 6l9 12 9-12', pts:[[0,0],[.5,1],[1,0]]},
  stairs:  {d:'M3 19h4v-4h4v-4h4V7h6', pts:[[0,1],[.25,1],[.25,.67],[.5,.67],[.5,.33],[.75,.33],[.75,0],[1,0]]},
  square:  {d:'M5 6h14v12H5z', pts:[[0,0],[1,0],[1,1],[0,1],[0,0]]},
  circle:  {d:'M12 5a7 7 0 1 0 0 14 7 7 0 1 0 0-14', pts:Array.from({length:49},(_,i)=>[.5+.5*Math.cos(i/48*Math.PI*2),.5+.5*Math.sin(i/48*Math.PI*2)])},
  heart:   {d:'M12 20l-7-7a4 4 0 0 1 7-5 4 4 0 0 1 7 5z', pts:[[.5,1],[.2,.6],[.05,.35],[.1,.1],[.3,0],[.5,.2],[.7,0],[.9,.1],[.95,.35],[.8,.6],[.5,1]]},
  star:    {d:'M12 3l2.5 6.5 7 .5-5.5 4.5 2 7-6-4-6 4 2-7L2.5 10l7-.5z', pts:Array.from({length:11},(_,i)=>{ const a=-Math.PI/2+i*Math.PI/5; const r=i%2?.45:1; return [.5+.5*r*Math.cos(a),.5+.5*r*Math.sin(a)]; })},
  dots:    {d:'M5 12h.1M12 12h.1M19 12h.1', pts:null},
};
state.shape='wave'; state.size=1;
function shapePts(name,size,center){
  const [cols,rows]=SIZES[size]; const w=cols*colW(), h=rows*rowH();
  const x0=Math.round((center.x-w/2)/colW())*colW(), y0=Math.round((center.y-h/2)/rowH())*rowH();
  if(name==='dots'){ // short ticks on every other column: a beat pattern
    const pts=[]; for(let i=0;i<cols;i+=2){ const x=x0+(i+.5)*colW(); pts.push({x,y:y0+h*.3},{x,y:y0+h*.7},{x:x+colW()*.01,y:y0+h*.3}); }
    return pts; }
  return SHAPES[name].pts.map(([u,v])=>({x:x0+u*w,y:y0+v*h}));
}
const shWrap=$('shapes');
Object.entries(SHAPES).forEach(([k,s])=>{ const b=document.createElement('button'); b.title=k; b.setAttribute('aria-label',k+' shape'); b.dataset.shape=k;
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="'+s.d+'"/></svg>'; b.onclick=()=>{ state.shape=k; setTool('shape'); toast(k+' · tap the canvas to place'); }; shWrap.appendChild(b); });
$('sizes').querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.size=+b.dataset.size; $('sizes').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); if(state.tool!=='shape') setTool('shape'); });

// ---------- rendering ----------
let playX=-1, hits=[];
function render(){
  dctx.clearRect(0,0,W,H);
  dctx.lineCap='round'; dctx.lineJoin='round';
  for(const s of strokes()){
    dctx.strokeStyle=COLORS[s.color]; dctx.lineWidth=Math.max(2.5,Math.min(4,W/180)); dctx.beginPath();
    s.pts.forEach((p,i)=> i?dctx.lineTo(p.x,p.y):dctx.moveTo(p.x,p.y)); dctx.stroke();
  }
  if(playX>=0){
    dctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--head').trim();
    dctx.lineWidth=1.5; dctx.beginPath(); dctx.moveTo(playX,0); dctx.lineTo(playX,H); dctx.stroke();
    const r=Math.max(4,Math.min(7,colW()*.3));
    for(const h of hits){ dctx.fillStyle=COLORS[h.color]; dctx.beginPath(); dctx.arc(h.x,h.y,r,0,Math.PI*2); dctx.fill(); }
  }
}

// ---------- audio ----------
let ac=null, master=null, revSend=null, dlySend=null, dly=null, recDest=null;
const delayTime = () => 60/state.bpm*.75; // dotted eighth
function buildGraph(ctx){ // the same chain is built for live playback and for offline rendering
  const g={ac:ctx};
  g.master=ctx.createGain(); g.master.gain.value=state.volume;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18;
  const lim=ctx.createDynamicsCompressor(); lim.threshold.value=-3; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=.001; lim.release.value=.08;
  g.master.connect(comp).connect(lim).connect(ctx.destination); g.limiter=lim;
  const len=Math.floor(ctx.sampleRate*2.4); const ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++){ const k=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-k,2.6)*(i<200?i/200:1); } }
  const conv=ctx.createConvolver(); conv.buffer=ir; const revLp=ctx.createBiquadFilter(); revLp.type='lowpass'; revLp.frequency.value=5000;
  g.revSend=ctx.createGain(); g.revSend.gain.value=state.reverb; g.revSend.connect(conv).connect(revLp).connect(g.master);
  g.dly=ctx.createDelay(2); g.dly.delayTime.value=delayTime(); const fb=ctx.createGain(); fb.gain.value=.42; const dlLp=ctx.createBiquadFilter(); dlLp.type='lowpass'; dlLp.frequency.value=3200;
  g.dlySend=ctx.createGain(); g.dlySend.gain.value=state.delay; g.dlySend.connect(g.dly); g.dly.connect(dlLp).connect(fb).connect(g.dly); dlLp.connect(g.master);
  return g;
}
function useGraph(g){ ac=g.ac; master=g.master; revSend=g.revSend; dlySend=g.dlySend; dly=g.dly; }
let liveGraph=null;
function audio(){
  if(ac&&ac===liveGraph.ac) return ac;
  if(!liveGraph){ liveGraph=buildGraph(new (window.AudioContext||window.webkitAudioContext)()); }
  useGraph(liveGraph); return ac;
}
function midiDeg(deg){
  const sc=SCALES[state.scale];
  const oct=Math.floor(deg/sc.length), idx=((deg%sc.length)+sc.length)%sc.length;
  return 12*(state.octave+1)+state.key+oct*12+sc[idx]-12;
}
function midiFor(row){ return midiDeg(ROWS-1-row); } // top row is highest
const DRUMS=new Set(['kick','softkick','snare','clap','hat','crash','rim','noise','shaker','laser']);
const SUSTAIN=new Set(['pad','tape','drone','organ','flute','subbass','wobble','growl','supersaw']);
function chordDegs(deg,instr){
  if(state.chord==='off'||DRUMS.has(instr)) return [deg];
  const n=SCALES[state.scale].length;
  if(state.chord==='triad') return [deg,deg+2,deg+4];
  if(state.chord==='power') return [deg,deg+4,deg+n];
  return [deg,deg+2,deg+4,deg+6];
}
const hz = m => 440*Math.pow(2,(m-69)/12);
const noiseBufs=new WeakMap();
function noise(){ let nb=noiseBufs.get(ac); if(!nb){ nb=ac.createBuffer(1,ac.sampleRate*1.5,ac.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; noiseBufs.set(ac,nb); } const s=ac.createBufferSource(); s.buffer=nb; return s; }
const shaperMaps=new WeakMap();
function dist(k){ let m=shaperMaps.get(ac); if(!m){ m={}; shaperMaps.set(ac,m); } if(!m[k]){ const n=2048,c=new Float32Array(n); for(let i=0;i<n;i++){ const x=i*2/n-1; c[i]=(3+k)*x*20*(Math.PI/180)/(Math.PI+k*Math.abs(x)); } const ws=ac.createWaveShaper(); ws.curve=c; ws.oversample='2x'; m[k]=ws; } return m[k]; }

function voice(instr,midi,t,opt){
  opt=opt||{}; const vel=opt.vel||1, hold=!!opt.hold; let release=null;
  const f=hz(midi);
  const out=ac.createGain(); out.connect(master); out.connect(revSend); out.connect(dlySend);
  const nodes=[];
  const osc=(type,freq,dest)=>{ const o=ac.createOscillator(); o.type=type; o.frequency.value=freq; o.connect(dest||out); nodes.push(o); return o; };
  const filt=(type,freq,q)=>{ const l=ac.createBiquadFilter(); l.type=type; l.frequency.value=freq; if(q)l.Q.value=q; l.connect(out); return l; };
  const drive=(k,gain)=>{ const g=ac.createGain(); g.gain.value=gain||1; const ws=dist(k); const post=ac.createGain(); post.gain.value=.3; g.connect(ws); ws.connect(post); post.connect(out); return g; };
  const env=(a,d,s,r,peak)=>{ peak*=vel; const sus=Math.min(Math.max(s*vel,peak*.5),peak);
    out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(peak,t+a);
    if(hold){ out.gain.exponentialRampToValueAtTime(sus,t+a+d); for(const n of nodes){ n.start(t); n.stop(t+20); }
      release=(tr)=>{ tr=Math.max(tr,t+a+.02); const rr=Math.max(r,.12); out.gain.cancelScheduledValues(tr); out.gain.setValueAtTime(sus,tr); out.gain.exponentialRampToValueAtTime(.0005,tr+rr); for(const n of nodes){ try{ n.stop(tr+rr+.05); }catch(e){} } setTimeout(()=>{ try{ out.disconnect(); }catch(e){} },(tr-ac.currentTime+rr+.3)*1000); }; }
    else { out.gain.exponentialRampToValueAtTime(Math.max(s*vel,.0005),t+a+d); out.gain.exponentialRampToValueAtTime(.0005,t+a+d+r); for(const n of nodes){ n.start(t); n.stop(t+a+d+r+.05);} } };
  const hit=(type,cutoff,d,peak,q)=>{ const n=noise(); const l=filt(type,cutoff,q); n.connect(l); nodes.push(n); env(.001,d,.001,.02,peak); };
  const string=(freq,bright,decay,peak)=>{ peak*=vel; // plucked string: delay line with lowpass feedback, kept strictly below unity gain
    const minDelay=128/ac.sampleRate+.0002; const period=1/freq; const k=Math.max(1,Math.ceil(minDelay/period)); // browsers cannot loop a delay shorter than 128 samples, so use k whole periods
    const dl=ac.createDelay(1); dl.delayTime.value=k*period;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=bright; lp.Q.value=-6;
    const fb=ac.createGain(); fb.gain.value=Math.min(decay,.96);
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=freq*.7; hp.Q.value=-6;
    const ex=ac.createGain(); ex.gain.setValueAtTime(1,t); ex.gain.setValueAtTime(0,t+2*period+.001);
    const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=freq; const n=noise(); const ng=ac.createGain(); ng.gain.value=.3;
    o.connect(ex); n.connect(ng).connect(ex); ex.connect(dl); dl.connect(lp).connect(fb).connect(dl); dl.connect(hp).connect(out);
    o.start(t); o.stop(t+.05); n.start(t); n.stop(t+.05);
    const len=1.6; out.gain.setValueAtTime(peak,t); out.gain.setValueAtTime(peak,t+len*.6); out.gain.exponentialRampToValueAtTime(.0005,t+len); out.gain.setValueAtTime(0,t+len+.01);
    fb.gain.setValueAtTime(fb.gain.value,t+len); fb.gain.linearRampToValueAtTime(0,t+len+.05);
    setTimeout(()=>{ try{ dl.disconnect(); lp.disconnect(); fb.disconnect(); hp.disconnect(); out.disconnect(); }catch(e){} },(t-ac.currentTime+len+.3)*1000); };
  switch(instr){
    // strings
    case 'acoustic': string(f,Math.min(f*5,4200),.95,.5); break;
    case 'acousticlo': string(f/2,Math.min(f*4,2800),.955,.55); break;
    case 'nylon': string(f,Math.min(f*3,2000),.94,.45); break;
    case 'upright': string(f/2,800,.955,.6); break;
    case 'shaker': hit('bandpass',7000,.07,.18,1.5); break;
    // melodic, clean
    case 'pluck': { const l=filt('lowpass',f*6); l.frequency.exponentialRampToValueAtTime(f*1.2,t+.3); osc('triangle',f,l); env(.005,.25,.001,.1,.35); break; }
    case 'piano': { const l=filt('lowpass',f*5); l.frequency.exponentialRampToValueAtTime(f*1.5,t+.5); osc('triangle',f,l); osc('sine',f*2,l).detune.value=3; env(.004,.5,.01,.3,.3); break; }
    case 'lofipiano': { const l=filt('lowpass',1400); osc('triangle',f*0.995,l); osc('sine',f*2.01,l); env(.01,.6,.02,.4,.3); break; }
    case 'bell': { const o=osc('sine',f*2); const m=ac.createOscillator(); m.frequency.value=f*7; const mg=ac.createGain(); mg.gain.setValueAtTime(f*3,t); mg.gain.exponentialRampToValueAtTime(1,t+.6); m.connect(mg).connect(o.frequency); nodes.push(m); env(.004,.6,.002,.5,.3); break; }
    case 'marimba': { osc('sine',f); const g2=ac.createGain(); g2.gain.setValueAtTime(.25,t); g2.gain.exponentialRampToValueAtTime(.001,t+.08); g2.connect(out); osc('sine',f*4,g2); env(.003,.18,.001,.08,.45); break; }
    case 'chime': osc('sine',f*4); env(.002,.4,.001,.6,.22); break;
    case 'flute': { const l=filt('lowpass',f*2.5); osc('sine',f,l); osc('triangle',f*1.003,l); env(.06,.3,.3,.25,.2); break; }
    case 'organ': { for(const [m,g] of [[1,1],[2,.6],[3,.3],[4,.25],[6,.1]]){ const gg=ac.createGain(); gg.gain.value=g*.4; gg.connect(out); osc('sine',f*m,gg);} env(.01,.1,.6,.08,.3); break; }
    case 'pad': { const l=filt('lowpass',f*3); osc('sawtooth',f,l); osc('sawtooth',f*1.004,l); env(.08,.5,.15,.4,.14); break; }
    case 'tape': { const l=filt('lowpass',f*2.2); const o=osc('triangle',f,l); o.detune.setValueAtTime(-8,t); o.detune.linearRampToValueAtTime(6,t+.6); osc('triangle',f*.5,l); env(.1,.5,.2,.5,.2); break; }
    case 'drone': { const l=filt('lowpass',f*2); osc('sawtooth',f*.5,l); osc('sawtooth',f*.5*1.007,l); osc('sine',f,l); env(.3,.6,.4,.9,.12); break; }
    // synth, electronic
    case 'lead': { const l=filt('lowpass',f*1.5,6); l.frequency.exponentialRampToValueAtTime(f*8,t+.08); l.frequency.exponentialRampToValueAtTime(f*2,t+.3); osc('sawtooth',f,l); env(.01,.25,.03,.15,.25); break; }
    case 'supersaw': { const l=filt('lowpass',f*6); for(const d of [-12,-5,0,5,12]) osc('sawtooth',f,l).detune.value=d; env(.01,.3,.1,.2,.09); break; }
    case 'stab': { const l=filt('lowpass',f*8,2); l.frequency.exponentialRampToValueAtTime(f*1.5,t+.12); osc('sawtooth',f,l); osc('sawtooth',f*1.5,l); osc('square',f*2,l); env(.003,.12,.001,.05,.14); break; }
    case 'acid': { const l=filt('lowpass',f*1.2,14); l.frequency.exponentialRampToValueAtTime(f*10,t+.03); l.frequency.exponentialRampToValueAtTime(f*1.5,t+.25); osc('sawtooth',f/2,l); env(.003,.22,.02,.08,.3); break; }
    case 'arp': { const l=filt('lowpass',f*6); osc('square',f,l); env(.002,.1,.001,.04,.2); break; }
    case 'subbass': osc('sine',f/2); osc('sine',f/4); env(.01,.3,.3,.15,.4); break;
    case 'eightoeight': { const o=osc('sine',f/2); o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f/2,t+.05); const d=drive(4,.8); o.disconnect(); o.connect(d); env(.003,.5,.1,.3,.6); break; }
    case 'wobble': { const l=filt('lowpass',200,8); const lfo=ac.createOscillator(); lfo.frequency.value=state.bpm/60*2; const lg=ac.createGain(); lg.gain.value=f*3; lfo.connect(lg).connect(l.frequency); nodes.push(lfo); const d=drive(6,.7); d.disconnect(); d.connect(out); osc('sawtooth',f/2,l); osc('square',f/2*1.01,l); env(.01,.4,.3,.15,.3); break; }
    case 'growl': { const l=filt('bandpass',f*2,6); const lfo=ac.createOscillator(); lfo.type='square'; lfo.frequency.value=state.bpm/60*4; const lg=ac.createGain(); lg.gain.value=f*4; lfo.connect(lg).connect(l.frequency); nodes.push(lfo); osc('sawtooth',f/2,l); osc('sawtooth',f/2*1.5,l); env(.01,.35,.2,.1,.28); break; }
    case 'laser': { const o=osc('square',f*4); o.frequency.exponentialRampToValueAtTime(f/2,t+.18); env(.002,.15,.001,.05,.2); break; }
    // guitars
    case 'cleangtr': { const l=filt('lowpass',f*4); l.frequency.exponentialRampToValueAtTime(f*1.3,t+.4); osc('triangle',f,l); osc('sawtooth',f*2,l); env(.004,.4,.005,.2,.25); break; }
    case 'distgtr': { const d=drive(20,2); const l=ac.createBiquadFilter(); l.type='lowpass'; l.frequency.value=3200; l.connect(d); osc('sawtooth',f,l); osc('sawtooth',f*1.003,l); env(.005,.35,.08,.15,.35); break; }
    case 'powerchord': { const d=drive(25,2.5); const l=ac.createBiquadFilter(); l.type='lowpass'; l.frequency.value=2800; l.connect(d); osc('sawtooth',f/2,l); osc('sawtooth',f/2*1.5,l); osc('sawtooth',f,l); env(.005,.4,.15,.2,.35); break; }
    case 'chug': { const d=drive(40,3); const l=ac.createBiquadFilter(); l.type='lowpass'; l.frequency.setValueAtTime(2500,t); l.frequency.exponentialRampToValueAtTime(400,t+.12); l.connect(d); osc('sawtooth',f/4,l); osc('sawtooth',f/4*1.5,l); env(.002,.12,.001,.04,.5); break; }
    case 'djent': { const d=drive(50,3); const l=ac.createBiquadFilter(); l.type='bandpass'; l.frequency.value=900; l.Q.value=1.5; l.connect(d); osc('sawtooth',f/4,l); osc('square',f/4*1.5,l); env(.002,.18,.02,.06,.5); break; }
    case 'shred': { const d=drive(35,2); const l=ac.createBiquadFilter(); l.type='lowpass'; l.frequency.value=4500; l.connect(d); const o=osc('sawtooth',f*2,l); o.detune.setValueAtTime(0,t); o.detune.linearRampToValueAtTime(-30,t+.15); env(.003,.2,.05,.1,.3); break; }
    case 'rockbass': { const d=drive(8,1.5); const l=ac.createBiquadFilter(); l.type='lowpass'; l.frequency.value=700; l.connect(d); osc('sawtooth',f/2,l); osc('square',f/4,l); env(.004,.3,.1,.1,.45); break; }
    case 'shout': { const l=filt('bandpass',f*3,3); const n=noise(); const ng=ac.createGain(); ng.gain.value=.25; n.connect(ng).connect(l); nodes.push(n); osc('sawtooth',f,l); osc('square',f*1.01,l); env(.02,.2,.05,.08,.3); break; }
    // chiptune
    case 'square': osc('square',f); env(.002,.15,.2,.05,.15); break;
    case 'pulse': { const o=osc('square',f); o.detune.setValueAtTime(0,t); o.detune.setValueAtTime(12,t+.06); o.detune.setValueAtTime(0,t+.12); env(.002,.18,.15,.04,.13); break; }
    case 'nes': { const o=osc('triangle',f); env(.002,.2,.3,.04,.3); break; }
    case 'tribass': osc('triangle',f/2); env(.002,.2,.3,.04,.4); break;
    case 'noise': hit('highpass',3000,.06,.18); break;
    // drums
    case 'kick': { const o=osc('sine',Math.max(f/4,40)*2); o.frequency.exponentialRampToValueAtTime(40,t+.12); env(.002,.18,.001,.05,.9); break; }
    case 'softkick': { const o=osc('sine',110); o.frequency.exponentialRampToValueAtTime(45,t+.15); env(.004,.22,.001,.08,.6); break; }
    case 'snare': { const o=osc('triangle',180); o.frequency.exponentialRampToValueAtTime(120,t+.08); const n=noise(); const l=filt('highpass',1500); n.connect(l); nodes.push(n); env(.001,.14,.001,.04,.5); break; }
    case 'clap': { for(const dt of [0,.012,.024]){ const n=noise(); const l=filt('bandpass',1200,1.2); const g=ac.createGain(); g.gain.setValueAtTime(.5,t+dt); g.gain.exponentialRampToValueAtTime(.001,t+dt+.09); n.connect(l); l.disconnect(); l.connect(g).connect(out); n.start(t+dt); n.stop(t+dt+.15);} env(.001,.12,.001,.05,.9); break; }
    case 'hat': hit('highpass',6000,.05,.25); break;
    case 'crash': hit('highpass',4000,.8,.3); break;
    case 'rim': { const n=noise(); const l=filt('bandpass',2500,4); n.connect(l); nodes.push(n); osc('square',900,l); env(.001,.05,.001,.02,.35); break; }
    default: osc('sine',f); env(.01,.2,.01,.1,.3);
  }
  return {release: release||(()=>{})};
}

// ---------- sequencer ----------
let nextStep=0, nextTime=0, timer=null, stepEvents=[];
const stepDur = () => 60/state.bpm/(state.stepsPerBar/4);
function notesAtStep(step){
  const x0=step*colW(), x1=x0+colW(); const found=new Map(); // key: row|color -> point
  for(const s of strokes()){
    for(let i=0;i<s.pts.length;i++){
      const p=s.pts[i]; const prev=s.pts[i-1];
      const crosses = p.x>=x0&&p.x<x1 || (prev&&((prev.x<x0&&p.x>=x1)||(prev.x>=x1&&p.x<x0)));
      if(crosses){ const row=Math.min(ROWS-1,Math.max(0,Math.floor(p.y/rowH()))); const k=row+'|'+s.color; if(!found.has(k)) found.set(k,{row,color:s.color,x:x0+colW()/2,y:(row+.5)*rowH()}); }
    }
  }
  return [...found.values()];
}
const held=new Map(); // row|color -> [voice handles] for sustaining instruments
function releaseAll(t){ const tt=t!=null?t:(ac?ac.currentTime:0); for(const v of held.values()) v.forEach(h=>h.release(tt)); held.clear(); }
function playStep(step,t,heldMap){
  const notes=notesAtStep(step);
  const tt=t+((step%2)?state.swing*stepDur():0);
  const seen=new Set();
  for(const n of notes){ try{
    const instr=INSTR[n.color]; const degs=chordDegs(ROWS-1-n.row,instr);
    if(SUSTAIN.has(instr)){ const k=n.row+'|'+n.color; seen.add(k); if(!heldMap.has(k)) heldMap.set(k,degs.map((d,i)=>voice(instr,midiDeg(d),tt,{hold:true,vel:i?.6:1}))); }
    else degs.forEach((d,i)=>voice(instr,midiDeg(d),tt,{vel:i?.65:1}));
  }catch(e){ console.error(e); } }
  for(const [k,v] of heldMap){ if(!seen.has(k)){ v.forEach(h=>h.release(tt)); heldMap.delete(k); } }
  return {t:tt,step,notes};
}
function schedule(){
  while(nextTime<ac.currentTime+.12){
    stepEvents.push(playStep(nextStep,nextTime,held));
    nextTime+=stepDur(); nextStep=(nextStep+1)%totalSteps();
  }
}
function animate(){
  if(!state.playing) return;
  const now=ac.currentTime;
  while(stepEvents.length>1&&stepEvents[1].t<=now) stepEvents.shift();
  if(stepEvents.length){ const ev=stepEvents[0]; const frac=Math.min(1,(now-ev.t)/stepDur()); playX=(ev.step+frac)*colW(); hits=(now-ev.t<stepDur()*.6)?ev.notes:[]; }
  render(); requestAnimationFrame(animate);
}
function setPlaying(on){
  state.playing=on; $('play').classList.toggle('on',on);
  $('playIcon').setAttribute('d', on?'M7 5h4v14H7z M13 5h4v14h-4z':'M7 5l12 7-12 7z');
  if(on){ audio(); if(ac.state==='suspended') ac.resume(); nextStep=0; nextTime=ac.currentTime+.05; stepEvents=[]; timer=setInterval(schedule,25); requestAnimationFrame(animate); }
  else { clearInterval(timer); releaseAll(); playX=-1; hits=[]; render(); }
}

  $('bpm').value=state.bpm; keys.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.n===state.key));
  $('density').querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.steps===state.stepsPerBar));
  syncFeel(); drawGrid(); render(); meta(); $('hint').classList.add('off');
}
async function deflate(bytes){ if(!window.CompressionStream) return null; try{ const cs=new CompressionStream('deflate-raw'); const w=cs.writable.getWriter(); w.write(bytes); w.close(); const buf=await new Response(cs.readable).arrayBuffer(); return new Uint8Array(buf); }catch(e){ return null; } }
async function inflate(bytes){ const ds=new DecompressionStream('deflate-raw'); const w=ds.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
async function shareCode(){ const raw=packState(); const z=await deflate(raw); return (z&&z.length<raw.length)?'sz'+b32enc(z):'sr'+b32enc(raw); }
async function loadFromHash(){
  const h=location.hash.replace('#',''); if(!/^s[rz][a-z2-7]+$/.test(h)) return false;
  try{ let bytes=b32dec(h.slice(2)); if(h[1]==='z') bytes=await inflate(bytes); unpackState(bytes); toast('Opened shared sketch'); return true; }catch(e){ console.error(e); toast('Could not open that link'); return false; }
}
$('share').onclick=async()=>{
  const code=await shareCode(); const url=location.origin+location.pathname+'#'+code;
  try{ history.replaceState(null,'','#'+code); }catch(e){}
  try{ await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch(e){ try{ if(navigator.share){ await navigator.share({title:'Sketchtune',url}); return; } }catch(e2){} window.prompt('Copy this link',url); }
};
window.addEventListener('hashchange',()=>{ loadFromHash(); });

// keyboard shortcuts
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return; if(e.key===' '){e.preventDefault();$('play').click();} if(e.key==='e')setTool('eraser'); if(e.key==='p')setTool('pen'); if(e.key==='s')setTool('shape'); if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('undo').click();} });

resize(); drawGrid(); render(); meta(); syncFeel();
loadFromHash().then(ok=>{ if(!ok){ load(); drawGrid(); render(); meta(); } });
})();
</script>
